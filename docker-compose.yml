version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: local-change-monitor-db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: local_change_monitor
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
